<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border:1px solid black;
          width: 50%;
          border-collapse: collapse;
          margin: 0 auto;

        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Gender</th>
        <th>City</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>John Doe</td>
        <td>30</td>
        <td>Male</td>
        <td>New York</td>
      </tr>
      <tr>
        <td>Jane Smith</td>
        <td>28</td>
        <td>Female</td>
        <td>Los Angeles</td>
      </tr> 
      <tr>
        <td>Mike Johnson</td>
        <td>35</td>
        <td>Male</td>
        <td>Chicago</td>
      </tr>
    </tbody>
  </table>  
</body>
</html>
